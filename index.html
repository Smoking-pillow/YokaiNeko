<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YokaiNeko v0.2</title>
    <style>
      /* GLOBAL RESET + BASE */
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        background-color: black;
        color: #f5f5f5;
      }

      h1 {
        text-align: center;
        color: #ff6f61;
        margin: 20px 0;
      }

      /* ==== TOP NAVBAR ==== */
      .top-navbar {
        background-color: #14131f;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 20px;
        flex-wrap: wrap; /* ✅ wrap for small screens */
        cursor: pointer;
      }

      .top-navbar ul {
        list-style: none;
        display: flex;
        gap: 15px;
        margin: 0;
        padding: 0;
        flex-wrap: wrap;
      }

      .top-navbar li a {
        color: white;
        padding: 10px 15px;
        text-decoration: none;
        border-radius: 6px;
        transition: background 0.3s, border 0.3s;
        border: 2px solid transparent;
      }

      .top-navbar li a:hover {
        background: #2f2e44;
        border: 2px solid white; /* ✅ border effect */
      }

      /* Search Bar */
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .search-container input {
        padding: 6px 10px;
        border-radius: 4px;
        border: none;
        outline: none;
        background: #2f2e44;
        color: white;
      }

      /* ==== MAIN CONTENT ==== */
      .mainbody {
        background-color: #201f31;
        margin: 20px auto;
        padding: 40px 20px;
        border-radius: 8px;
        max-width: 1200px;
      }

      /* BUTTON SECTION */
      .button-container {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 15px;
        margin: 20px 0;
      }

      .button-container button {
        flex: 1 1 100px;
        max-width: 150px;
        height: 120px;
        border-radius: 12px;
        border: none;
        color: white;
        font-weight: bold;
        font-size: 1em;
        cursor: pointer;
        transition: transform 0.2s, opacity 0.2s;
      }

      .button-container button:hover {
        transform: translateY(-5px);
        opacity: 0.9;
      }

      /* COLORS */
      .watched {
        background-color: #ff6f61;
      }
      .watching {
        background-color: #aaa;
        color: black;
      }
      .future {
        background-color: darkviolet;
      }

      /* ==== FOOTER NAVBAR ==== */
      .footer-navbar {
        background-color: #14131f;
        padding: 20px;
        cursor: pointer;
      }

      .footer-navbar ul {
        list-style: none;
        display: flex;
        justify-content: center;
        gap: 20px;
        margin: 0;
        padding: 0;
        flex-wrap: wrap;
      }

      .footer-navbar li a {
        color: white;
        text-decoration: none;
        padding: 8px 12px;
        border-radius: 6px;
        border: 2px solid transparent;
        transition: background 0.3s, border 0.3s;
      }

      .footer-navbar li a:hover {
        background: #2f2e44;
        border: 2px solid white;
      }

      footer {
        text-align: center;
        font-size: 0.9em;
        color: #aaa;
        margin: 20px 0;
      }

      /* ==== RESPONSIVE ==== */
      @media (max-width: 768px) {
        h1 {
          font-size: 1.5rem;
        }

        .button-container button {
          flex: 1 1 45%;
          max-width: none;
          height: 100px;
        }

        .top-navbar {
          flex-direction: column;
          align-items: flex-start;
          gap: 10px;
        }

        .search-container {
          width: 100%;
        }

        .search-container input {
          width: 100%;
        }

        .footer-navbar ul {
          flex-direction: column;
          align-items: center;
        }
      }

      @media (max-width: 480px) {
        .button-container button {
          flex: 1 1 100%;
          height: 80px;
        }
      }

      /* ====Joint Works==== */
      .top-navbar li a:focus,
      .footer-navbar li a:focus,
      .button-container button:focus {
        outline: 2px solid #ff6f61;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <!-- TOP NAVBAR -->
    <nav class="top-navbar" aria-label="Main navigation">
      <ul>
        <li><a href="#">Trending</a></li>
        <li><a href="#">Top Airing</a></li>
        <li><a href="#">Newest</a></li>
        <li><a href="login\login.html">Sign in</a></li>
      </ul>
      <div class="search-container">
        <label for="search" class="sr-only">Search</label>
        <input id="search" type="text" placeholder="Search..." />
      </div>
    </nav>

    <!-- MAIN CONTENT -->
    <main class="mainbody">
      <section>
        <h1>Welcome to YokaiNeko</h1>
      </section>

      <section aria-labelledby="watching-section">
        <h2 id="watching-section" class="sr-only">Anime Watch Status</h2>
        <div class="button-container">
          <button class="watched">Watched</button>
          <button class="watching">Watching</button>
          <button class="future">Will Watch</button>
        </div>
      </section>
    </main>

    <!-- FOOTER NAVBAR -->
    <nav class="footer-navbar" aria-label="Footer navigation">
      <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Services</a></li>
        <li><a href="#">Contact Me</a></li>
      </ul>
    </nav>

    <footer>
      v0.2 — Dual Navbar Layout | All information is provided through licensed
      and legal sources.
    </footer>
  </body>
</html>
